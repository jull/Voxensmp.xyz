<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxenSmp Season 8 - Server Minecraft Semi-RPG Indonesia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #030405;
            color: #eaeef2;
            line-height: 1.6;
        }

        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.5);
            --secondary: #ec4899;
            --accent: #10b981;
            --bg-deep: #030405;
            --bg-card: #111317;
            --bg-surface: #1a1d24;
            --border-glow: 0 0 15px var(--primary-glow);
            --gradient-gold: linear-gradient(135deg, #fbbf24, #f59e0b);
            --gradient-purple: linear-gradient(135deg, #8b5cf6, #ec4899);
            --gradient-premium: linear-gradient(135deg, #f59e0b, #ef4444);
            --gradient-legendary: linear-gradient(135deg, #ffd700, #ff8c00, #ff4500);
            --gradient-darkness: linear-gradient(135deg, #2c3e50, #1a1a2e, #16213e);
            --gradient-mythic: linear-gradient(135deg, #8e44ad, #9b59b6, #c0392b);
            --gradient-victorium: linear-gradient(135deg, #f1c40f, #e67e22, #d35400);
            --gradient-knight: linear-gradient(135deg, #7f8c8d, #95a5a6, #bdc3c7);
            --gradient-elite: linear-gradient(135deg, #3498db, #2980b9, #2c3e50);
            --gradient-prime: linear-gradient(135deg, #e74c3c, #c0392b, #e67e22);
            --whatsapp: #25D366;
            --discord: #5865f2;
            --vote: #ffaa00;
        }

        /* Animations */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px var(--primary); }
            50% { box-shadow: 0 0 40px var(--secondary); }
            100% { box-shadow: 0 0 20px var(--primary); }
        }

        @keyframes legendary-glow {
            0% { text-shadow: 0 0 10px gold; }
            50% { text-shadow: 0 0 30px orange, 0 0 50px red; }
            100% { text-shadow: 0 0 10px gold; }
        }

        @keyframes float-weapon {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        @keyframes rank-glow {
            0% { filter: drop-shadow(0 0 5px currentColor); }
            50% { filter: drop-shadow(0 0 20px currentColor); }
            100% { filter: drop-shadow(0 0 5px currentColor); }
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: rgba(3, 4, 5, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: var(--gradient-purple);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-badge {
            background: var(--gradient-gold);
            color: black;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            margin-left: 0.5rem;
            display: inline-block;
            vertical-align: middle;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #b0b8c5;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: white;
            text-shadow: 0 0 10px var(--primary);
        }

        .social-links {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .social-btn {
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            transition: 0.2s;
            text-decoration: none;
            color: white;
        }

        .discord-btn {
            background: var(--discord);
        }

        .discord-btn:hover {
            background: #4752c4;
            transform: scale(1.02);
        }

        .wa-btn {
            background: var(--whatsapp);
        }

        .wa-btn:hover {
            background: #20b858;
            transform: scale(1.02);
        }

        .vote-btn {
            background: var(--vote);
            color: black;
        }

        .vote-btn:hover {
            background: #e69500;
            transform: scale(1.02);
        }

        /* ===== HERO SECTION SEASON 8 ===== */
        .hero {
            padding: 6rem 5%;
            background: radial-gradient(circle at 20% 40%, rgba(139, 92, 246, 0.15), transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.15), transparent 40%),
                        linear-gradient(165deg, #030405 0%, #0f1117 100%);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .season-badge {
            display: inline-block;
            background: linear-gradient(145deg, #8b5cf6, #ec4899);
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 0.6rem 2.5rem;
            border-radius: 40px;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: pulse-glow 2s infinite;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, #d8b4fe, #fbcfe8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .hero-sub {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }

        .hero-sub span {
            color: var(--primary);
            border-bottom: 3px solid var(--secondary);
        }

        .legendary-quote {
            font-size: 1.3rem;
            color: #ffd700;
            font-style: italic;
            margin-top: 2rem;
            animation: legendary-glow 3s infinite;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid #ffd700;
        }

        /* ===== IP SECTION - LOWERCASE ===== */
        .ip-section {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(139, 92, 246, 0.3);
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
            padding: 3rem 5%;
        }

        .ip-container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .ip-box {
            background: linear-gradient(145deg, #1a1d24, #0f1117);
            border: 2px solid var(--primary);
            border-radius: 80px;
            padding: 1.2rem 2.5rem;
            display: inline-flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 0 40px var(--primary-glow);
        }

        .ip-text {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        .copy-btn {
            background: var(--gradient-purple);
            color: white;
            border: none;
            padding: 0.8rem 2.5rem;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 25px var(--primary);
        }

        .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px var(--primary);
        }

        .player-count {
            margin-top: 1.5rem;
            font-size: 1.2rem;
            color: var(--accent);
            font-weight: 600;
        }

        .player-count span {
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.5rem;
        }

        /* ===== RANKS SECTION ===== */
        .ranks {
            padding: 5rem 5%;
            background: #080a0e;
            position: relative;
            overflow: hidden;
        }

        .ranks::before {
            content: "👑";
            position: absolute;
            top: 5%;
            right: 5%;
            font-size: 15rem;
            opacity: 0.03;
            transform: rotate(15deg);
            pointer-events: none;
        }

        .ranks-title {
            text-align: center;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .ranks-title span {
            background: var(--gradient-purple);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .ranks-sub {
            text-align: center;
            color: #94a3b8;
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto 4rem auto;
        }

        .ranks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .rank-card {
            background: linear-gradient(145deg, #1a1d24, #111317);
            border-radius: 40px;
            padding: 2rem;
            border: 2px solid transparent;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .rank-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .rank-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 20px currentColor);
            animation: rank-glow 3s infinite;
        }

        .rank-name {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .rank-price {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 1rem 0;
            padding: 0.5rem;
            border-radius: 50px;
            background: rgba(0,0,0,0.5);
        }

        .rank-features {
            list-style: none;
            margin: 1.5rem 0;
            text-align: left;
        }

        .rank-features li {
            color: #9ca3af;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .rank-features li::before {
            content: "✓";
            color: var(--accent);
            font-weight: 700;
            margin-right: 0.5rem;
        }

        .rank-buy {
            background: transparent;
            color: white;
            border: 2px solid;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            margin-top: 1rem;
        }

        .rank-buy:hover {
            transform: scale(1.02);
            background: white;
            color: black;
        }
